<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--SEO_HEAD-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script>
      try {
        const t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      /* loading cover: hides the crawlable text until the app is drawn; matches the theme */
      #boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;font:italic 64px Georgia,serif;background:#ffffff;color:#4f46e5}
      .dark #boot{background:#09090b;color:#c7d2fe}
      html,body{background:#ffffff}
      html.dark,html.dark body{background:#09090b}
    </style>
  </head>
  <body>
    <!-- covers the crawlable text version until the app takes over (removed in main.jsx) -->
    <div id="boot">vb</div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
